<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1560" viewBox="0 0 1400 1560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1400" height="1560" fill="#f8fafc"/>

  <text x="700" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">База знаний: модель данных и три способа поиска</text>
  <text x="700" y="76" text-anchor="middle" font-size="15" fill="#64748b">Карточка = тема. Описание = оглавление. Теги = ярлыки. Поиск разный — не путать.</text>

  <!-- ============ ЧАСТЬ 1: МОДЕЛЬ ДАННЫХ ============ -->
  <text x="60" y="130" font-size="20" font-weight="700" fill="#0f172a">1. Что такое карточка</text>

  <!-- Project box -->
  <rect x="60" y="152" width="300" height="74" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="78" y="178" font-size="13" font-weight="700" fill="#166534">ПРОЕКТ</text>
  <text x="78" y="200" font-size="17" font-weight="600" fill="#14532d">dcell</text>
  <text x="78" y="218" font-size="13" fill="#4b5563">ровно 1 на карточку</text>

  <line x1="360" y1="189" x2="470" y2="189" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Card box -->
  <rect x="480" y="152" width="860" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="502" y="180" font-size="13" font-weight="700" fill="#334155">КАРТОЧКА «Дизайн dCell»</text>

  <!-- summary -->
  <rect x="502" y="196" width="816" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="516" y="220" font-size="12" font-weight="700" fill="#1e40af">ОПИСАНИЕ · 200–300 символов · читается ВСЕГДА</text>
  <text x="516" y="243" font-size="14" fill="#1e3a8a">«В dCell дизайн строго Excel-like: белое полотно, серые линии 1px,</text>
  <text x="516" y="263" font-size="14" fill="#1e3a8a">зелёный только для действий. Тёмной темы нет.»</text>

  <!-- theme -->
  <rect x="502" y="290" width="240" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="516" y="313" font-size="12" font-weight="700" fill="#92400e">ТЕМА (ровно 1)</text>
  <text x="516" y="336" font-size="15" font-weight="600" fill="#78350f">Дизайн</text>
  <text x="516" y="354" font-size="12" fill="#78350f">задаёт место в проекте</text>

  <!-- tags -->
  <rect x="758" y="290" width="300" height="70" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="772" y="313" font-size="12" font-weight="700" fill="#6b21a8">ТЕГИ (1–3, для поиска)</text>
  <text x="772" y="336" font-size="14" fill="#581c87">excel · стиль · интерфейс</text>
  <text x="772" y="354" font-size="12" fill="#581c87">ярлыки, не группировка</text>

  <!-- versions -->
  <rect x="1074" y="290" width="244" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1088" y="313" font-size="12" font-weight="700" fill="#334155">ВЕРСИЯ</text>
  <text x="1088" y="336" font-size="14" fill="#1e293b">superseded_by</text>
  <text x="1088" y="354" font-size="12" fill="#475569">старая не отдаётся</text>

  <!-- content -->
  <rect x="502" y="376" width="816" height="84" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="516" y="400" font-size="12" font-weight="700" fill="#475569">ПОЛНЫЙ ТЕКСТ · читается ТОЛЬКО если описание подошло</text>
  <text x="516" y="423" font-size="13" fill="#334155">Палитра #107c41 · контраст min 4.71:1 · Segoe UI Variable Text</text>
  <text x="516" y="443" font-size="13" fill="#334155">Тонкие линии вместо карточек и теней · без тёмной темы (решение владельца 21.09.2026)</text>

  <!-- Legend for cost -->
  <rect x="60" y="300" width="300" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="78" y="324" font-size="13" font-weight="700" fill="#334155">СТОИМОСТЬ ЧТЕНИЯ</text>
  <rect x="78" y="338" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="102" y="350" font-size="13" fill="#334155">описание · ~80 токенов</text>
  <rect x="78" y="362" width="14" height="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="102" y="374" font-size="13" fill="#334155">полный текст · ~400–900</text>
  <text x="78" y="402" font-size="12" fill="#64748b">25 карточек dCell:</text>
  <text x="78" y="418" font-size="12" font-weight="700" fill="#16a34a">2k токенов вместо 12k</text>

  <!-- ============ ЧАСТЬ 2: СХЕМА ПРОЕКТА ============ -->
  <text x="60" y="548" font-size="20" font-weight="700" fill="#0f172a">2. Проект — это плоское оглавление (h1 / h2, глубже не бывает)</text>

  <rect x="60" y="570" width="380" height="60" rx="10" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="78" y="596" font-size="16" font-weight="700" fill="#ffffff">h1 · Паспорт dCell</text>
  <text x="78" y="618" font-size="13" fill="#dcfce7">что это за проект, для кого, чем отличается</text>

  <g font-size="14">
    <rect x="480" y="566" width="270" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="496" y="588" font-size="11" font-weight="700" fill="#16a34a">h2</text>
    <text x="522" y="588" font-weight="600" fill="#1e293b">Архитектура</text>
    <text x="496" y="604" font-size="11" fill="#64748b">как устроено: сервер + надстройка</text>

    <rect x="766" y="566" width="270" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="782" y="588" font-size="11" font-weight="700" fill="#16a34a">h2</text>
    <text x="808" y="588" font-weight="600" fill="#1e293b">Структура</text>
    <text x="782" y="604" font-size="11" fill="#64748b">где что лежит, куда смотреть</text>

    <rect x="480" y="624" width="270" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="496" y="646" font-size="11" font-weight="700" fill="#16a34a">h2</text>
    <text x="522" y="646" font-weight="700" fill="#1e293b">Дизайн</text>
    <text x="496" y="662" font-size="11" fill="#1e40af">Excel-like: белое, серое, зелёный</text>

    <rect x="766" y="624" width="270" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="782" y="646" font-size="11" font-weight="700" fill="#16a34a">h2</text>
    <text x="808" y="646" font-weight="600" fill="#1e293b">Стек</text>
    <text x="782" y="662" font-size="11" fill="#64748b">Laravel 13, Orchid, VB.NET</text>

    <rect x="480" y="682" width="270" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="496" y="704" font-size="11" font-weight="700" fill="#16a34a">h2</text>
    <text x="522" y="704" font-weight="600" fill="#1e293b">Процессы</text>
    <text x="496" y="720" font-size="11" fill="#64748b">тесты, деплой, правило изменений</text>
  </g>

  <path d="M250 580 L250 640 L470 640" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ============ ЧАСТЬ 3: ТРИ ПОИСКА ============ -->
  <text x="60" y="790" font-size="20" font-weight="700" fill="#0f172a">3. Три разных способа достать знание</text>

  <!-- 3.1 question search -->
  <rect x="60" y="812" width="400" height="290" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="812" width="400" height="44" rx="12" fill="#2563eb"/>
  <rect x="60" y="840" width="400" height="16" fill="#2563eb"/>
  <text x="80" y="841" font-size="15" font-weight="700" fill="#ffffff">Поиск по вопросу</text>
  <text x="80" y="884" font-size="12" fill="#64748b">инструмент search_knowledge</text>

  <text x="80" y="912" font-size="13" font-weight="700" fill="#1e293b">Вход</text>
  <text x="80" y="932" font-size="13" fill="#334155">«какой дизайн у dcell?»</text>

  <text x="80" y="962" font-size="13" font-weight="700" fill="#1e293b">Метод</text>
  <text x="80" y="982" font-size="13" fill="#334155">BM25 по словам. Вес:</text>
  <text x="96" y="1002" font-size="13" fill="#334155">заголовок &gt; описание &gt; текст</text>

  <text x="80" y="1032" font-size="13" font-weight="700" fill="#1e293b">Возвращает</text>
  <rect x="80" y="1042" width="360" height="44" rx="6" fill="#dbeafe"/>
  <text x="94" y="1061" font-size="13" fill="#1e3a8a">описания карточек (даже старых)</text>
  <text x="94" y="1078" font-size="13" font-weight="700" fill="#1e3a8a">полный текст — по запросу</text>

  <!-- 3.2 project context -->
  <rect x="500" y="812" width="400" height="290" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="500" y="812" width="400" height="44" rx="12" fill="#16a34a"/>
  <rect x="500" y="840" width="400" height="16" fill="#16a34a"/>
  <text x="520" y="841" font-size="15" font-weight="700" fill="#ffffff">Контекст проекта</text>
  <text x="520" y="884" font-size="12" fill="#64748b">инструмент get_project_context</text>

  <text x="520" y="912" font-size="13" font-weight="700" fill="#1e293b">Вход</text>
  <text x="520" y="932" font-size="13" fill="#334155">«расскажи про dcell»</text>

  <text x="520" y="962" font-size="13" font-weight="700" fill="#1e293b">Метод</text>
  <text x="520" y="982" font-size="13" fill="#334155">не поиск, а ВЫДАЧА ВСЕГО</text>
  <text x="536" y="1002" font-size="13" fill="#334155">все карточки проекта по темам</text>

  <text x="520" y="1032" font-size="13" font-weight="700" fill="#1e293b">Возвращает</text>
  <rect x="520" y="1042" width="360" height="44" rx="6" fill="#dcfce7"/>
  <text x="534" y="1061" font-size="13" fill="#14532d">оглавление: тема + описание</text>
  <text x="534" y="1078" font-size="13" font-weight="700" fill="#14532d">тело — по запросу</text>

  <!-- 3.3 admin topics -->
  <rect x="940" y="812" width="400" height="290" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="940" y="812" width="400" height="44" rx="12" fill="#ea580c"/>
  <rect x="940" y="840" width="400" height="16" fill="#ea580c"/>
  <text x="960" y="841" font-size="15" font-weight="700" fill="#ffffff">Темы в админке</text>
  <text x="960" y="884" font-size="12" fill="#64748b">чипы над списком</text>

  <text x="960" y="912" font-size="13" font-weight="700" fill="#1e293b">Вход</text>
  <text x="960" y="932" font-size="13" fill="#334155">клик по теме</text>

  <text x="960" y="962" font-size="13" font-weight="700" fill="#1e293b">Метод</text>
  <text x="960" y="982" font-size="13" fill="#334155">фильтр по полю theme</text>
  <text x="976" y="1002" font-size="13" fill="#334155">без BM25</text>

  <text x="960" y="1032" font-size="13" font-weight="700" fill="#1e293b">Возвращает</text>
  <rect x="960" y="1042" width="360" height="44" rx="6" fill="#ffedd5"/>
  <text x="974" y="1061" font-size="13" fill="#7c2d12">карточки одной темы</text>
  <text x="974" y="1078" font-size="13" fill="#7c2d12">для человека</text>

  <!-- ============ ЧАСТЬ 4: СИНК ============ -->
  <text x="60" y="1160" font-size="20" font-weight="700" fill="#0f172a">4. Синк каждые 15 минут — когда модель НЕ вызывается</text>

  <rect x="60" y="1182" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="76" y="1208" font-size="14" font-weight="600" fill="#1e293b">Крон, 15 мин</text>
  <text x="76" y="1228" font-size="12" fill="#64748b">тишина?</text>

  <line x1="260" y1="1212" x2="320" y2="1212" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="1182" width="240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="346" y="1206" font-size="13" font-weight="600" fill="#1e293b">есть pending диалог</text>
  <text x="346" y="1224" font-size="13" fill="#334155">с сообщениями?</text>

  <!-- NO branch -->
  <line x1="450" y1="1242" x2="450" y2="1284" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="1268" font-size="13" font-weight="700" fill="#dc2626">НЕТ</text>
  <rect x="330" y="1294" width="240" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="346" y="1317" font-size="13" font-weight="700" fill="#991b1b">0 вызовов модели</text>
  <text x="346" y="1336" font-size="12" fill="#991b1b">только индексация и чистка</text>

  <!-- YES branch -->
  <line x1="570" y1="1212" x2="640" y2="1212" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="586" y="1202" font-size="13" font-weight="700" fill="#16a34a">ДА</text>

  <rect x="650" y="1182" width="290" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="666" y="1206" font-size="13" font-weight="600" fill="#1e3a8a">1 чтение оглавления</text>
  <text x="666" y="1224" font-size="12" fill="#1e3a8a">описания карточек ТОЛЬКО его проекта</text>

  <line x1="940" y1="1212" x2="1000" y2="1212" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1010" y="1182" width="330" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1026" y="1206" font-size="13" font-weight="600" fill="#14532d">модель решает по описаниям</text>
  <text x="1026" y="1224" font-size="12" fill="#14532d">какие карточки читать целиком</text>

  <line x1="1175" y1="1242" x2="1175" y2="1284" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1010" y="1294" width="330" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1026" y="1317" font-size="13" font-weight="600" fill="#14532d">дописывает нужные карточки</text>
  <text x="1026" y="1336" font-size="12" fill="#14532d">остальные не тронуты</text>

  <!-- Footer note -->
  <rect x="60" y="1390" width="1280" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="1416" font-size="14" font-weight="700" fill="#92400e">Почему это не жрёт токены в тишине</text>
  <text x="80" y="1440" font-size="13" fill="#78350f">Сейчас в базе 136 карточек ≈ 13 500 токенов. Если гонять всю базу каждые 15 минут — это ~1,3 млн токенов в сутки при полном молчании.</text>
  <text x="80" y="1462" font-size="13" fill="#78350f">С описаниями: оглавление dCell ≈ 2 000 токенов, и только когда пришёл диалог. В тишине — ноль вызовов модели.</text>
  <text x="80" y="1484" font-size="13" font-weight="600" fill="#92400e">Старые версии помечаются superseded_by и в поиск не попадают — база не раздувается историями.</text>
</svg>
