<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .bg { fill: #0f0c1d; }
      .card { fill: #17122b; stroke: #332b52; stroke-width: 1; }
      .card-accent { fill: #1b1533; stroke: #4c3f78; stroke-width: 1; }
      .t-title { fill: #f5f2ff; font-size: 34px; font-weight: 700; }
      .t-sub { fill: #c9c3dd; font-size: 16px; }
      .t-section { fill: #c4b5fd; font-size: 13px; letter-spacing: 2px; font-weight: 700; }
      .t-num { fill: #c4b5fd; font-size: 13px; font-weight: 700; }
      .t-who { fill: #8f86ab; font-size: 11px; letter-spacing: 1.2px; font-weight: 600; }
      .t-step { fill: #ede9fe; font-size: 16px; }
      .t-code { fill: #c4b5fd; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
      .t-small { fill: #8f86ab; font-size: 13px; }
      .t-box-title { fill: #ede9fe; font-size: 15px; font-weight: 650; }
      .arrow { stroke: #a78bfa; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="1280"/>

  <text class="t-title" x="60" y="64">Как харнесс подключается к Neiro Brain</text>
  <text class="t-sub" x="60" y="94">Два пути: OAuth — для клиентов, которые его умеют; ссылка /connect — для остальных. В обоих случаях токен не проходит через переписку с агентом.</text>

  <text class="t-section" x="60" y="142">Путь 1 · OAuth — Claude Desktop, Cursor, клиенты с MCP OAuth</text>

  <g>
    <rect class="card" x="60" y="156" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="186" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="191">1</text>
    <text class="t-who" x="122" y="180">КЛИЕНТ → СЕРВЕР</text>
    <text class="t-step" x="122" y="200">Запрос к серверу — без токена: в конфиге только адрес</text>
    <text class="t-code" x="560" y="199">POST /mcp/knowledge</text>

    <rect class="card" x="60" y="224" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="254" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="259">2</text>
    <text class="t-who" x="122" y="248">СЕРВЕР → КЛИЕНТ</text>
    <text class="t-step" x="122" y="268">Отказ с подсказкой, куда идти</text>
    <text class="t-code" x="560" y="267">401 + WWW-Authenticate: resource_metadata="…/oauth-protected-resource/mcp/knowledge"</text>

    <rect class="card" x="60" y="292" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="322" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="327">3</text>
    <text class="t-who" x="122" y="316">КЛИЕНТ → СЕРВЕР</text>
    <text class="t-step" x="122" y="336">Узнаёт сервер авторизации и регистрируется</text>
    <text class="t-code" x="560" y="335">GET /.well-known/oauth-protected-resource  →  POST /oauth/register</text>

    <rect class="card" x="60" y="360" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="390" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="395">4</text>
    <text class="t-who" x="122" y="384">КЛИЕНТ → БРАУЗЕР</text>
    <text class="t-step" x="122" y="404">Открывает страницу согласия</text>
    <text class="t-code" x="560" y="403">GET /oauth/authorize  ·  PKCE S256  ·  state</text>

    <rect class="card card-accent" x="60" y="428" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="458" r="13" fill="#3b2d71"/>
    <text class="t-num" x="87" y="463">5</text>
    <text class="t-who" x="122" y="452">ЧЕЛОВЕК</text>
    <text class="t-step" x="122" y="472">Входит в панель и нажимает «Разрешить»</text>
    <text class="t-code" x="560" y="471">email + пароль  →  «Разрешить»: доступ к своей базе знаний</text>

    <rect class="card" x="60" y="496" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="526" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="531">6</text>
    <text class="t-who" x="122" y="520">КЛИЕНТ → СЕРВЕР</text>
    <text class="t-step" x="122" y="540">Меняет код на собственный токен и хранит его у себя</text>
    <text class="t-code" x="560" y="539">POST /oauth/token  →  access_token  ·  scope mcp:use</text>

    <rect class="card" x="60" y="564" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="594" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="599">7</text>
    <text class="t-who" x="122" y="588">КЛИЕНТ → СЕРВЕР</text>
    <text class="t-step" x="122" y="608">Работает: поиск, чтение и запись карточек</text>
    <text class="t-code" x="560" y="607">MCP + Authorization: Bearer &lt;токен&gt;  →  search_knowledge, remember_many, get_knowledge …</text>
  </g>

  <path class="arrow" d="M 700 630 L 700 664"/>

  <text class="t-section" x="60" y="700">Путь 2 · Ссылка подключения — DeepSeek Harness и клиенты без OAuth</text>

  <g>
    <rect class="card" x="60" y="714" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="744" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="749">1</text>
    <text class="t-who" x="122" y="738">АГЕНТ</text>
    <text class="t-step" x="122" y="758">Печатает ссылку и ничего больше</text>
    <text class="t-code" x="560" y="757">/brain init  →  &lt;адрес&gt;/connect</text>

    <rect class="card card-accent" x="60" y="782" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="812" r="13" fill="#3b2d71"/>
    <text class="t-num" x="87" y="817">2</text>
    <text class="t-who" x="122" y="806">ЧЕЛОВЕК</text>
    <text class="t-step" x="122" y="826">Открывает ссылку, входит в панель и выпускает токен</text>
    <text class="t-code" x="560" y="825">«Выпустить токен и показать конфиг»</text>

    <rect class="card card-accent" x="60" y="850" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="880" r="13" fill="#3b2d71"/>
    <text class="t-num" x="87" y="885">3</text>
    <text class="t-who" x="122" y="874">ЧЕЛОВЕК</text>
    <text class="t-step" x="122" y="894">Копирует готовый блок: адрес и токен уже внутри</text>
    <text class="t-code" x="560" y="893">«Скопировать конфиг»  →  {"url": "…/mcp/knowledge", "headers": {"Authorization": "Bearer nb-…"}}</text>

    <rect class="card card-accent" x="60" y="918" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="948" r="13" fill="#3b2d71"/>
    <text class="t-num" x="87" y="953">4</text>
    <text class="t-who" x="122" y="942">ЧЕЛОВЕК</text>
    <text class="t-step" x="122" y="962">Вставляет блок в конфиг харнесса и перезапускает его</text>
    <text class="t-code" x="560" y="961">~/.dsh/profiles/&lt;профиль&gt;/cordis.patch.yml  ·  claude mcp add  ·  claude_desktop_config.json</text>

    <rect class="card" x="60" y="986" width="1280" height="60" rx="12"/>
    <circle cx="92" cy="1016" r="13" fill="#2a2150"/>
    <text class="t-num" x="87" y="1021">5</text>
    <text class="t-who" x="122" y="1010">КЛИЕНТ → СЕРВЕР</text>
    <text class="t-step" x="122" y="1030">Работает так же: те же инструменты, тот же владелец</text>
    <text class="t-code" x="560" y="1029">MCP + Authorization: Bearer nb-…  →  карточки только этого человека</text>
  </g>

  <text class="t-section" x="60" y="1096">Что происходит на сервере в обоих случаях</text>
  <g>
    <rect class="card" x="60" y="1110" width="290" height="96" rx="12"/>
    <text class="t-box-title" x="84" y="1138">Токен принят</text>
    <text class="t-small" x="84" y="1162">личный nb-… или OAuth</text>
    <text class="t-small" x="84" y="1182">со scope mcp:use</text>

    <path class="arrow" d="M 356 1158 L 392 1158"/>

    <rect class="card" x="398" y="1110" width="290" height="96" rx="12"/>
    <text class="t-box-title" x="422" y="1138">OwnerContext</text>
    <text class="t-small" x="422" y="1162">владелец берётся из токена,</text>
    <text class="t-small" x="422" y="1182">не из аргументов запроса</text>

    <path class="arrow" d="M 694 1158 L 730 1158"/>

    <rect class="card" x="736" y="1110" width="270" height="96" rx="12"/>
    <text class="t-box-title" x="760" y="1138">Фильтр owner_id</text>
    <text class="t-small" x="760" y="1162">внутри запроса к индексу,</text>
    <text class="t-small" x="760" y="1182">до расчёта BM25</text>

    <path class="arrow" d="M 1012 1158 L 1048 1158"/>

    <rect class="card" x="1054" y="1110" width="286" height="96" rx="12"/>
    <text class="t-box-title" x="1078" y="1138">Карточки владельца</text>
    <text class="t-small" x="1078" y="1162">чужие не видны ни в поиске,</text>
    <text class="t-small" x="1078" y="1182">ни по id</text>
  </g>

  <text class="t-small" x="60" y="1244">Отзыв: панель → «Токены» → «Подключённые приложения» (OAuth) или строка личного токена. После отзыва следующий запрос — 401.</text>
</svg>
