[neiro-brain.local]

app_start_command = 
backend_enabled   = off
backend_ip        = auto
backend_port      = auto
base_url          = {host_scheme}://{host_decoded}{scheme_port}
bind_ip           = 192.168.0.107 127.0.0.1
environment       = System PostgreSQL-14
http_engine       = Apache
http_port         = 80
https_port        = 443
node_engine       = auto
php_engine        = PHP-8.4
primary_domain    = on
project_category  = Neiro Brain
project_enabled   = on
project_root      = {base_dir}
server_aliases    = www.{host} 127.0.0.1 192.168.0.107 95.79.97.24
terminal_codepage = 65001
tls_cert_file     = auto
tls_enabled       = on
tls_key_file      = auto
web_root          = {base_dir}\public
